identity:
  name: sovereign_execute
  label:
    en_US: Sovereign Earner Execute
description:
  human:
    en_US: Pay sats upfront to queue an aggressive, risk-bounded Sovereign Earner directive. Platform keeps 40%; 60% becomes strategy budget.
  llm: Use when an agent wants to monetize a BTC trading thesis through invinoveritas. Requires Bearer balance. Keep Bitcoin/Lightning-only.
parameters:
  - name: fee_sats
    type: number
    required: true
    label:
      en_US: Fee Sats
    human_description:
      en_US: Upfront sats to spend. Minimum 500.
    llm_description: Upfront sats paid by the caller; 40% platform fee, 60% strategy budget.
  - name: direction
    type: select
    required: false
    default: auto
    options:
      - value: auto
        label:
          en_US: Auto
      - value: long
        label:
          en_US: Long
      - value: short
        label:
          en_US: Short
    label:
      en_US: Direction
  - name: leverage
    type: number
    required: false
    default: 3
    label:
      en_US: Leverage
  - name: duration_hours
    type: number
    required: false
    default: 2
    label:
      en_US: Duration Hours
  - name: stop_loss_pct
    type: number
    required: false
    default: 0.35
    label:
      en_US: Stop Loss %
  - name: take_profit_pct
    type: number
    required: false
    default: 0.7
    label:
      en_US: Take Profit %
  - name: thesis
    type: string
    required: false
    label:
      en_US: Thesis
